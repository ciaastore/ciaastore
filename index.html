<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciaa Store - Top Up & Services</title>
    <style>
        :root {
            --pink-main: #ff9ebb;
            --pink-soft: #ffe4ec;
            --pink-dark: #d85c80;
            --bg-color: #fff5f8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 158, 187, 0.3);
        }

        .header img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--pink-dark);
            font-size: 1rem;
            margin-top: 20px;
            border-bottom: 2px solid var(--pink-soft);
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--pink-dark);
            font-size: 0.9rem;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--pink-soft);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            border-color: var(--pink-main);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .item-card {
            border: 2px solid var(--pink-soft);
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        .item-card:hover {
            border-color: var(--pink-main);
            background-color: #fff9fb;
        }

        .item-card.active {
            border-color: var(--pink-dark);
            background-color: var(--pink-soft);
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
        }

        .item-price {
            font-size: 0.8rem;
            color: var(--pink-dark);
            margin-top: 4px;
            font-weight: 600;
        }

        .qris-box {
            text-align: center;
            background: var(--pink-soft);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
        }

        .qris-box img {
            max-width: 200px;
            border-radius: 10px;
            border: 2px solid var(--pink-main);
        }

        .btn-order {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-order:hover {
            background-color: #1eb956;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="banner.jpg" alt="Ciaa Store Banner">
    </div>

    <div class="form-group">
        <label for="category">1. Pilih Layanan / Game</label>
        <select id="category" onchange="loadItems()">
            <option value="">-- Pilih Layanan --</option>
            <option value="ff">Free Fire</option>
            <option value="ml">Mobile Legends</option>
            <option value="ml_ftu">Mobile Legends (First Top Up)</option>
            <option value="pubg">PUBG Mobile</option>
            <option value="hok">Honor of Kings</option>
            <option value="bs">Blood Strike</option>
            <option value="jasher">Jasher (Jasa Share)</option>
            <option value="jpm">JPM (Jasa Push Member)</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. Masukkan Data Akun / Format Order</label>
        <input type="text" id="userData" placeholder="Contoh: Username + ID (Server)">
    </div>

    <h2>3. Pilih Nominal / Paket</h2>
    <div class="grid-container" id="itemsGrid"></div>

    <h2>4. Pembayaran (QRIS All Payment)</h2>
    <div class="qris-box">
        <p style="margin-top:0; font-size: 0.85rem; font-weight:bold; color: var(--pink-dark);">Scan QRIS di bawah ini untuk membayar:</p>
        <img src="qris.jpg" alt="QRIS Ciaa Store">
        <p style="margin-bottom:0; font-size: 0.75rem; color: #666;">Mendukung DANA, GoPay, OVO, ShopeePay & M-Banking</p>
    </div>

    <button class="btn-order" onclick="sendOrder()">Konfirmasi & Kirim Bukti Transfer via WhatsApp</button>
</div>

    let selectedItem = null;

    function loadItems() {
        const category = document.getElementById('category').value;
        const grid = document.getElementById('itemsGrid');
        grid.innerHTML = '';
        selectedItem = null;

        if (!category || !products[category]) return;

        products[category].forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
                <div class="item-title">${item.name}</div>
                <div class="item-price">${item.price}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedItem = item;
            };
            grid.appendChild(card);
        });
    }

    function sendOrder() {
        const category = document.getElementById('category').selectedOptions[0].text;
        const userData = document.getElementById('userData').value;

        if (!document.getElementById('category').value) {
            alert('Silakan pilih layanan terlebih dahulu!');
            return;
        }
        if (!userData) {
            alert('Silakan isi ID / Data Akun terlebih dahulu!');
            return;
        }
        if (!selectedItem) {
            alert('Silakan pilih nominal/paket yang diinginkan!');
            return;
        }

        const adminPhone = "6289505929536";
        const message = `Halo Ciaa Store, saya sudah melakukan pembayaran untuk pesanan berikut:\n\n` +
                        `• *Layanan*: ${category}\n` +
                        `• *Paket*: ${selectedItem.name}\n` +
                        `• *Total*: ${selectedItem.price}\n` +
                        `• *Data Akun/Format*: ${userData}\n\n` +
                        `Berikut saya lampirkan foto bukti transfernya ya!`;

        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${adminPhone}?text=${encodedMessage}`, '_blank');
    }
</script>

</body>
</html>
