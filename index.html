<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ciaa Store Real</title>
    
    <!-- Pustaka Generator QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }

        h2 {
            color: #d85c80;
            margin-top: 0;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .btn-checkout {
            width: 100%;
            background-color: #d85c80;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background-color: #c24b6e;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-sizing: border-box;
        }

        .qrcode-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .amount-box {
            background: #ffe4ec;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .btn-action {
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .btn-download { background-color: #ff9ebb; color: #fff; }
        .btn-wa { background-color: #25D366; color: #fff; text-decoration: none; display: block; line-height: 20px; box-sizing: border-box;}
        .btn-close { background-color: #eee; color: #333; }
    </style>
</head>
<body>

    <!-- Form Checkout Sederhana -->
    <div class="card">
        <h2>Ciaa Store Real</h2>
        <div class="form-group">
            <label>User ID / Username:</label>
            <input type="text" id="userId" placeholder="Masukkan ID Game/Akun">
        </div>
        <div class="form-group">
            <label>Pilih Produk:</label>
            <select id="productSelect" onchange="updatePrice()">
                <option value="20000">Free Fire 140 Diamond - Rp 20.000</option>
                <option value="50000">Mobile Legends 170 Diamond - Rp 50.000</option>
                <option value="100000">Roblox 800 Robux - Rp 100.000</option>
            </select>
        </div>
        <div class="form-group">
            <label>Total Pembayaran:</label>
            <input type="text" id="totalPriceDisplay" value="Rp 20.000" readonly style="background: #f9f9f9; font-weight: bold;">
        </div>
        <button class="btn-checkout" onclick="processPayment()">Lanjutkan Pembayaran</button>
    </div>

    <!-- Modal Pop-up QRIS Pembayaran -->
    <div id="qrisModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:#d85c80; margin-top:0; margin-bottom:5px;">Pembayaran QRIS DANA</h3>
            <p style="font-size:0.8rem; color:#666; margin-top:0;">Scan atau unduh QRIS ini menggunakan aplikasi DANA / e-Wallet / M-Banking:</p>
            
            <div id="qrcode" class="qrcode-container"></div>
            
            <div class="amount-box">
                <span style="font-size:0.8rem; color:#666;">Total Nominal (Otomatis Terisi):</span><br>
                <strong id="modalAmountDisplay" style="font-size:1.2rem; color:#d85c80;">Rp 0</strong>
            </div>

            <button class="btn-action btn-download" onclick="downloadQR()">📥 Unduh Gambar QRIS</button>
            <a id="waLink" href="#" target="_blank" class="btn-action btn-wa">💬 Konfirmasi ke WhatsApp</a>
            <button class="btn-action btn-close" onclick="closeModal()">Tutup / Batal</button>
        </div>
    </div>

    <script>
        // Data QRIS Statis DANA milik Ciaa Store Real
        const rawQrisDana = "00020101021126570011ID.DANA.WWW011893600915303380466202090338046620303UMI51440014ID.CO.QRIS.WWW0215ID10265642557130303UMI5204549953033605802ID5915Ciaa Store Real6014Kota Pontianak610578114630476C7";
        
        // Nomor WhatsApp Admin Ciaa Store Real
        const adminWA = "6289505929536"; 

        let selectedNominal = 20000;

        function updatePrice() {
            selectedNominal = parseInt(document.getElementById("productSelect").value);
            document.getElementById("totalPriceDisplay").value = "Rp " + selectedNominal.toLocaleString('id-ID');
        }

        // Algoritma CRC16 EMVCo untuk QRIS
        function convertCRC16(str) {
            let crc = 0xFFFF;
            for (let c = 0; c < str.length; c++) {
                crc ^= str.charCodeAt(c) << 8;
                for (let i = 0; i < 8; i++) {
                    if ((crc & 0x8000) !== 0) {
                        crc = (crc << 1) ^ 0x1021;
                    } else {
                        crc = crc << 1;
                    }
                }
            }
            crc &= 0xFFFF;
            let hex = crc.toString(16).toUpperCase();
            return hex.length === 4 ? hex : "0".repeat(4 - hex.length) + hex;
        }

        // Fungsi Menyuntikkan Nominal ke Teks QRIS
        function generateDynamicQRIS(qrisStatis, nominal) {
            let qris = qrisStatis.slice(0, -4); // Hapus CRC16 lama
            qris = qris.replace("010211", "010212"); // Ubah status ke Dinamis
            
            let strNominal = nominal.toString();
            let tag54 = "54" + String(strNominal.length).padStart(2, '0') + strNominal;
            
            let pos58 = qris.indexOf("5802ID");
            let qrisDinamis = qris.slice(0, pos58) + tag54 + qris.slice(pos58) + "6304";
            
            return qrisDinamis + convertCRC16(qrisDinamis);
        }

        function processPayment() {
            const userId = document.getElementById("userId").value;
            if(!userId) {
                alert("Silakan masukkan User ID kamu terlebih dahulu!");
                return;
            }

            // Bersihkan container QR Code lama
            document.getElementById("qrcode").innerHTML = "";
            
            // Format Display Nominal
            document.getElementById("modalAmountDisplay").innerText = "Rp " + selectedNominal.toLocaleString('id-ID');
            
            // Generate String QRIS Baru dengan Nominal
            let dynamicString = generateDynamicQRIS(rawQrisDana, selectedNominal);
            
            // Render Gambar QR Code Baru
            new QRCode(document.getElementById("qrcode"), {
                text: dynamicString,
                width: 180,
                height: 180
            });

            // Set Link WhatsApp Konfirmasi
            const productName = document.getElementById("productSelect").options[document.getElementById("productSelect").selectedIndex].text;
            const textWA = `Halo Admin Ciaa Store Real, saya sudah bayar via QRIS:%0A%0A- User ID: ${userId}%0A- Pesanan: ${productName}%0A- Nominal: Rp ${selectedNominal.toLocaleString('id-ID')}%0A%0AMohon diproses ya, terima kasih!`;
            document.getElementById("waLink").href = `https://wa.me/${adminWA}?text=${textWA}`;

            // Tampilkan Modal
            document.getElementById("qrisModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("qrisModal").style.display = "none";
        }

        function downloadQR() {
            let img = document.querySelector("#qrcode img");
            if (img) {
                let a = document.createElement("a");
                a.href = img.src;
                a.download = `QRIS-CiaaStore-${selectedNominal}.png`;
                a.click();
            }
        }
    </script>
</body>
</html>
