<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciaa Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Ciaa Store</h1>
            <nav class="flex gap-4 text-sm">
                <a href="#" class="hover:text-pink-400">Layanan</a>
                <a href="#" class="hover:text-pink-400">Kontak</a>
            </nav>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-xl mx-auto p-6 w-full space-y-6">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-pink-400">Form Pemesanan Ciaa Store</h2>
            <p class="text-sm text-slate-400 mb-4">Silakan pilih layanan dan lengkapi data pesanan Anda di bawah ini.</p>
            
            <form class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">Nama Store / Akun</label>
                    <input type="text" placeholder="Masukkan nama store atau data akun" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-sm mb-1">Pilih Layanan</label>
                    <select class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-pink-500">
                        <option>Jasher</option>
                        <option>JPM</option>
                        <option>Free Fire</option>
                        <option>Mobile Legends</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg text-sm transition">
                    Pesan Sekarang
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 text-center text-xs text-slate-500">
        &copy; 2026 Ciaa Store. All rights reserved.
    </footer>

</body>
</html>
